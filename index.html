<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="A little something is on its way.">
  <title>Updating..soon</title>
  <style>
    :root {
      color-scheme: dark;
      --amber: #ffb22e;
      --gold: #ffe5a1;
      --orange: #ff742c;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 54%, rgba(105, 48, 10, .18), transparent 39%),
        radial-gradient(ellipse at 50% 100%, rgba(75, 34, 10, .13), transparent 44%),
        #090909;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      width: min(92vw, 760px);
      min-height: 360px;
      isolation: isolate;
    }

    .halo {
      position: absolute;
      z-index: -1;
      width: clamp(230px, 42vw, 370px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 166, 41, .15) 0%, rgba(255, 110, 35, .07) 37%, transparent 69%);
      filter: blur(5px);
      animation: halo-breathe 4.4s ease-in-out infinite;
    }

    .orbit {
      position: absolute;
      width: clamp(215px, 39vw, 340px);
      aspect-ratio: 1;
      border: 1px solid transparent;
      border-top-color: rgba(255, 185, 72, .7);
      border-right-color: rgba(255, 126, 46, .18);
      border-radius: 50%;
      filter: drop-shadow(0 0 8px rgba(255, 166, 41, .48));
      animation: orbit 8s linear infinite;
    }

    .orbit::after {
      content: "";
      position: absolute;
      top: 16%;
      right: 11%;
      width: 6px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px 3px rgba(255, 168, 44, .75);
    }

    h1 {
      margin: 0;
      padding: .15em .28em .24em;
      font-size: clamp(2.5rem, 8vw, 5.8rem);
      font-weight: 650;
      letter-spacing: .015em;
      line-height: 1.06;
      text-align: center;
      white-space: nowrap;
      color: transparent;
      background: linear-gradient(108deg, #ff7a25 5%, #ffbc4a 35%, #fff0bd 52%, #ffad32 70%, #ff742c 96%);
      background-size: 240% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      filter: drop-shadow(0 0 18px rgba(255, 145, 42, .27));
      opacity: 0;
      transform: translateY(15px) scale(.97);
      animation: arrive 1.25s cubic-bezier(.2, .75, .24, 1) .18s forwards,
                 shimmer 5s ease-in-out 1.45s infinite,
                 text-glow 3.8s ease-in-out 1.45s infinite;
    }

    .spark {
      position: absolute;
      width: 3px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #ffd889;
      box-shadow: 0 0 11px 2px rgba(255, 151, 37, .72);
      opacity: 0;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .spark:nth-of-type(1) { top: 25%; left: 21%; animation-delay: .35s; }
    .spark:nth-of-type(2) { top: 69%; left: 77%; animation-delay: 1.15s; }
    .spark:nth-of-type(3) { top: 73%; left: 28%; animation-delay: 1.8s; }
    .spark:nth-of-type(4) { top: 30%; left: 73%; animation-delay: .8s; }

    @keyframes arrive {
      0% { opacity: 0; transform: translateY(15px) scale(.97); filter: drop-shadow(0 0 0 rgba(255,145,42,0)); }
      65% { opacity: 1; transform: translateY(-2px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shimmer { 0%, 100% { background-position: 100% 50%; } 50% { background-position: 0% 50%; } }
    @keyframes text-glow {
      0%, 100% { filter: drop-shadow(0 0 13px rgba(255,145,42,.22)); }
      50% { filter: drop-shadow(0 0 25px rgba(255,157,48,.42)); }
    }
    @keyframes halo-breathe { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%, 100% { opacity: .18; transform: scale(.65); } 50% { opacity: .9; transform: scale(1.35); } }

    @media (max-width: 420px) {
      .stage { min-height: 290px; }
      h1 { font-size: clamp(2.25rem, 10vw, 3rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      h1 { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Site update announcement">
    <div class="halo" aria-hidden="true"></div>
    <div class="orbit" aria-hidden="true"></div>
    <span class="spark" aria-hidden="true"></span>
    <span class="spark" aria-hidden="true"></span>
    <span class="spark" aria-hidden="true"></span>
    <span class="spark" aria-hidden="true"></span>
    <h1>Updating..soon</h1>
  </main>
</body>
</html>
